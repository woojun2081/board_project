<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge0"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기폼</title>
</head>
<body>
<H1>글쓰기폼</H1>
<form action="/write" method="post" enctype="multipart/form-data">
    이름: <span th:text="${loginInfo.nickname}"></span><br>
    제목: <input type="text" name="title" /><br />
    내용: <br>
    <textarea name="content" cols="50" rows="5"></textarea><br>   <!-- 50개의 게시물과 5개의 열(제목, 조회수, 날짜 등등)-->
    이미지: <input type="file" name="image" accept="image/*" /><br>
    <input type="submit" value="등록" />
</form>
</body>
</html>
