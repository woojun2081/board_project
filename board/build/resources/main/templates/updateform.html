<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Copatible" content="IE=edge0"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정 폼</title>
</head>
<body>
<H1>글수정 폼</H1>
<form action="/update" method="post">
    <input type="hidden" name="boardId" th:value="${board.boardId}" />
    이름: <span th:text="${loginfo.nickname}"></span><br>
    제목: <input type="text" name="title" th:value="${board.title}" /><br />
    내용: <br>
    <textarea name="content" cols="50" rows="5" th:text="${board.content}"></textarea><br>   <!-- 50개의 게시물과 5개의 열(제목, 조회수, 날짜 등등)-->
    <input type="submit" value="수정" />
</form>
</body>
</html>
